<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SBO_KEYS = ["Breach","Pending","No Breach","Sent Back"];

function monthFromDate(iso) {
  if (!iso) return null;
  const m = parseInt(iso.slice(5, 7), 10);
  if (!m || m < 1 || m > 12) return null;
  return MONTHS[m - 1];
}

function normHeader(h) {
  return String(h || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function findColumn(headers, mustIncludeAny) {
  const normed = headers.map(h => ({ raw: h, n: normHeader(h) }));
  for (const candidates of mustIncludeAny) {
    const hit = normed.find(h => candidates.every(c => h.n.includes(c)));
    if (hit) return hit.raw;
  }
  return null;
}

function excelSerialToISO(v) {
  if (v instanceof Date) {
    const y = v.getFullYear(), m = String(v.getMonth() + 1).padStart(2, "0"), d = String(v.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  if (typeof v === "number") {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    const y = d.getUTCFullYear(), m = String(d.getUTCMonth() + 1).padStart(2, "0"), dd = String(d.getUTCDate()).padStart(2, "0");
    return `${y}-${m}-${dd}`;
  }
  if (typeof v === "string") {
    const s = v.trim();
    let mm = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if (mm) return `${mm[3]}-${mm[2].padStart(2,"0")}-${mm[1].padStart(2,"0")}`;
    mm = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (mm) return `${mm[1]}-${mm[2].padStart(2,"0")}-${mm[3].padStart(2,"0")}`;
    const parsed = new Date(s);
    if (!isNaN(parsed.getTime())) {
      const y = parsed.getFullYear(), m = String(parsed.getMonth() + 1).padStart(2, "0"), d = String(parsed.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
  }
  return null;
}

function readWorkbook(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array", cellDates: true });
        const sheetName = wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: null, raw: true });
        resolve({ rows, sheetName });
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsArrayBuffer(file);
  });
}

function processMappingRows(rawRows) {
  if (!rawRows.length) return { data: [], error: "The file has no rows." };
  const headers = Object.keys(rawRows[0]);
  const locCol = findColumn(headers, [["location"]]);
  const tlCol = findColumn(headers, [["tlsname"], ["tlname"], ["teamlead"], ["tl"]]);
  const dealCol = findColumn(headers, [["dealership"], ["dealer"]]);
  if (!locCol || !tlCol) {
    return { data: [], error: `Missing required columns. Found headers: ${headers.slice(0, 8).join(", ")}${headers.length > 8 ? "..." : ""}. Need a Location column and a TL Name column.` };
  }
  const byLocation = new Map();
  let blanks = 0;
  for (const r of rawRows) {
    const loc = r[locCol] != null ? String(r[locCol]).trim() : "";
    const tl = r[tlCol] != null ? String(r[tlCol]).trim() : "";
    if (!loc && !tl) continue;
    if (!loc || !tl) { blanks++; continue; }
    const key = loc.toLowerCase();
    if (!byLocation.has(key)) byLocation.set(key, { loc, dealership: dealCol ? String(r[dealCol] ?? "").trim() : "", tls: new Set() });
    byLocation.get(key).tls.add(tl);
  }
  const conflicts = Array.from(byLocation.values()).filter(v => v.tls.size > 1);
  if (conflicts.length) {
    const preview = conflicts.slice(0, 5).map(c => `"${c.loc}" -> ${Array.from(c.tls).join(" / ")}`).join("; ");
    const more = conflicts.length > 5 ? `, and ${conflicts.length - 5} more location(s)` : "";
    return { data: [], error: `Duplicate locations found, each mapped to more than one TL: ${preview}${more}. Each Location must map to exactly one TL — fix the file and re-upload.` };
  }
  const data = Array.from(byLocation.values()).map(v => ({ dealership: v.dealership, tl: Array.from(v.tls)[0], location: v.loc }));
  const warnings = [];
  if (blanks) warnings.push(`${blanks} row(s) skipped for missing Location or TL Name.`);
  return { data, error: null, warnings };
}

function buildMappingDict(mappingRows) {
  const dict = new Map();
  for (const m of mappingRows) dict.set(m.location.trim().toLowerCase(), m.tl);
  return dict;
}

function normalizePaymentStatus(v) {
  const s = v == null ? "" : String(v).trim().toLowerCase();
  if (s === "yes") return "Yes";
  if (s === "no") return "No";
  return null;
}

function processPaymentRows(rawRows, mappingDict) {
  if (!rawRows.length) return { data: [], error: "The file has no rows." };
  const headers = Object.keys(rawRows[0]);
  const locCol = findColumn(headers, [["location"]]);
  const statusCol = findColumn(headers, [["verificationstatus"], ["paymentstatus"], ["paymentverification"], ["status"]]);
  const tlCol = findColumn(headers, [["tlsname"], ["tlname"]]);
  if (!locCol && !tlCol) {
    return { data: [], error: `Missing a Location or TL Name column. Found headers: ${headers.slice(0, 8).join(", ")}${headers.length > 8 ? "..." : ""}.` };
  }
  if (!statusCol) {
    return { data: [], error: `Could not find a Payment Verification Status column. Found headers: ${headers.slice(0, 8).join(", ")}${headers.length > 8 ? "..." : ""}.` };
  }
  const data = [];
  let unknownLoc = 0, invalidStatus = 0;
  for (const r of rawRows) {
    const loc = locCol ? String(r[locCol] ?? "").trim() : "";
    let tl = tlCol ? String(r[tlCol] ?? "").trim() : "";
    const statusRaw = r[statusCol];
    const statusEmpty = statusRaw == null || String(statusRaw).trim() === "";
    if (!tl && !loc && statusEmpty) continue;
    if (!tl && loc) {
      tl = mappingDict.get(loc.toLowerCase()) || "";
      if (!tl) unknownLoc++;
    }
    const status = normalizePaymentStatus(statusRaw);
    if (!status) { invalidStatus++; continue; }
    data.push({ tl: tl || "Unknown TL", loc, status });
  }
  const warnings = [];
  if (unknownLoc) warnings.push(`${unknownLoc} row(s) had a location not found in the mapping file and were grouped under "Unknown TL".`);
  if (invalidStatus) warnings.push(`${invalidStatus} record(s) were ignored because Payment Verification Status was blank or not Yes/No.`);
  return { data, error: null, warnings };
}

function processRowDataRows(rawRows, mappingDict) {
  if (!rawRows.length) return { data: [], error: "The file has no rows." };
  const headers = Object.keys(rawRows[0]);
  const locCol = findColumn(headers, [["location"]]);
  const tlCol = findColumn(headers, [["tlname"]]);
  const dateCol = findColumn(headers, [["deliverydate"]]);
  const sboCol = findColumn(headers, [["sentbackoptions"], ["sentback"]]);
  const bnCol = findColumn(headers, [["bookingnumber"], ["bookingno"]]);
  const statusCol = findColumn(headers, [["dealstatus"]]);
  if (!locCol) {
    return { data: [], error: `Could not find a Location column. Found headers: ${headers.slice(0, 8).join(", ")}${headers.length > 8 ? "..." : ""}.` };
  }
  const data = [];
  let unknownLoc = 0, invalidDates = 0, duplicateBn = 0;
  const bnSeen = new Set();
  for (const r of rawRows) {
    const loc = String(r[locCol] ?? "").trim();
    let tl = tlCol ? String(r[tlCol] ?? "").trim() : "";
    if (!tl) tl = mappingDict.get(loc.toLowerCase()) || "";
    if (!tl && loc) unknownLoc++;
    const rawDate = dateCol ? r[dateCol] : null;
    const iso = rawDate != null ? excelSerialToISO(rawDate) : null;
    if (dateCol && rawDate != null && !iso) invalidDates++;
    if (!loc && !tl && !iso) continue;
    const bn = bnCol && r[bnCol] != null ? String(r[bnCol]).trim() : "";
    let isDuplicateBn = false;
    if (bn) {
      if (bnSeen.has(bn)) { duplicateBn++; isDuplicateBn = true; }
      else bnSeen.add(bn);
    }
    data.push({
      tl: tl || "Unknown TL",
      loc,
      date: iso,
      sbo: sboCol ? (r[sboCol] != null ? String(r[sboCol]).trim() : null) : null,
      bn: bn || null,
      status: statusCol ? String(r[statusCol] ?? "") : null,
      isDuplicateBn,
    });
  }
  const warnings = [];
  if (unknownLoc) warnings.push(`${unknownLoc} row(s) had a location not found in the mapping file and were grouped under "Unknown Location".`);
  if (invalidDates) warnings.push(`${invalidDates} row(s) had an unreadable Delivery Date and were excluded from monthly counts.`);
  if (duplicateBn) warnings.push(`${duplicateBn} record(s) repeat a Booking/Order ID already seen in this file. Use the Records toggle on the Dashboard to count all records or unique Booking IDs only.`);
  return { data, error: null, warnings };
}

function dedupeByBookingId(rows) {
  const seen = new Set();
  const out = [];
  for (const r of rows) {
    if (r.bn) {
      if (seen.has(r.bn)) continue;
      seen.add(r.bn);
    }
    out.push(r);
  }
  return out;
}

function processBookingRows(rawRows) {
  if (!rawRows.length) return { data: [], error: "The file has no rows." };
  const headers = Object.keys(rawRows[0]);
  const idCol = findColumn(headers, [["bookingid"], ["bookingno"], ["bookingnumber"], ["bookingnos"], ["bookingref"], ["bookingrefno"]]);
  const locCol = findColumn(headers, [["location"]]);
  if (!idCol) {
    return { data: [], error: "Unable to process file: Booking Number column not found." };
  }
  const data = [];
  const seen = new Set();
  let duplicates = 0, blanks = 0;
  for (const r of rawRows) {
    const id = r[idCol] != null ? String(r[idCol]).trim() : "";
    if (!id) { blanks++; continue; } // Blank Booking IDs are excluded from comparison
    if (seen.has(id)) { duplicates++; continue; } // Duplicate Booking IDs: first occurrence kept
    seen.add(id);
    const loc = locCol ? (r[locCol] != null ? String(r[locCol]).trim() : "") : "";
    data.push({ bookingId: id, location: loc });
  }
  const warnings = [];
  if (blanks) warnings.push(`${blanks} row(s) with a blank Booking ID were excluded from the comparison.`);
  if (duplicates) warnings.push(`${duplicates} duplicate Booking ID(s) were ignored (first occurrence kept).`);
  if (!locCol) warnings.push("Location column not found. TL assignment cannot be completed.");
  return { data, error: null, warnings };
}

// Compares Old Data vs Current Data by unique Booking ID and builds a TL-wise summary.
// Single pass over each dataset using Sets/Maps, so it stays fast even for 50K-100K+ row files.
// New File is ALWAYS the actual Booking ID difference — never Current Count - Old Count.
function computePCFileStatus() {
  const mappingDict = buildMappingDict(state.mappingRows);
  const oldIds = new Set();
  for (const r of state.oldData) oldIds.add(r.bookingId);
  const currentIds = new Set();
  for (const r of state.currentData) currentIds.add(r.bookingId);

  const oldCounts = new Map();
  for (const r of state.oldData) {
    const tl = mappingDict.get((r.location || "").toLowerCase()) || "Not Assigned";
    oldCounts.set(tl, (oldCounts.get(tl) || 0) + 1);
  }

  let newFileCount = 0;
  const newCounts = new Map();
  for (const r of state.currentData) {
    if (oldIds.has(r.bookingId)) continue; // Rule 1: exists in both -> ignore
    newFileCount++; // Rule 2: only in Current Data -> New File
    const tl = mappingDict.get((r.location || "").toLowerCase()) || "Not Assigned";
    newCounts.set(tl, (newCounts.get(tl) || 0) + 1);
  }
  // Rule 3 (only in Old Data) is intentionally ignored (future enhancement).

  const tlNames = new Set([...oldCounts.keys(), ...newCounts.keys()]);
  const report = Array.from(tlNames).map(tl => {
    const newFile = newCounts.get(tl) || 0;
    const oldFile = oldCounts.get(tl) || 0;
    return { tl, newFile, oldFile, total: newFile + oldFile };
  }).sort((a, b) => b.total - a.total || a.tl.localeCompare(b.tl));

  const grandTotal = report.reduce((acc, r) => {
    acc.newFile += r.newFile; acc.oldFile += r.oldFile; acc.total += r.total; return acc;
  }, { newFile: 0, oldFile: 0, total: 0 });

  // Reconciliation check: guards against any future logic drift producing an inconsistent report.
  const reconciled =
    grandTotal.newFile === newFileCount &&
    grandTotal.oldFile === oldIds.size &&
    grandTotal.total === grandTotal.oldFile + grandTotal.newFile;

  return {
    oldCount: oldIds.size,
    currentCount: currentIds.size,
    newFileCount,
    report,
    grandTotal,
    reconciled,
  };
}

function aggregatePayment(paymentData, tlFilter, locFilter, statusFilter, search, allTLs) {
  const map = new Map();
  for (const r of paymentData) {
    if (tlFilter && r.tl !== tlFilter) continue;
    if (locFilter && r.loc !== locFilter) continue;
    if (statusFilter && r.status !== statusFilter) continue;
    if (search && !(`${r.tl} ${r.loc} ${r.status}`.toLowerCase().includes(search.toLowerCase()))) continue;
    if (!map.has(r.tl)) map.set(r.tl, { tl: r.tl, yes: 0, no: 0, total: 0 });
    const row = map.get(r.tl);
    const s = (r.status || "").toLowerCase();
    if (s === "yes") row.yes++;
    else if (s === "no") row.no++;
    row.total++;
  }
  if (allTLs && !locFilter && !search) {
    for (const tl of allTLs) {
      if (tlFilter && tl !== tlFilter) continue;
      if (!map.has(tl)) map.set(tl, { tl, yes: 0, no: 0, total: 0 });
    }
  }
  return Array.from(map.values()).sort((a, b) => b.total - a.total || a.tl.localeCompare(b.tl));
}

function aggregateUnknownLocations(paymentData, tlFilter, locFilter, statusFilter, search) {
  if (tlFilter && tlFilter !== "Unknown TL") return [];
  const map = new Map();
  for (const r of paymentData) {
    if (r.tl !== "Unknown TL") continue;
    if (locFilter && r.loc !== locFilter) continue;
    if (statusFilter && r.status !== statusFilter) continue;
    if (search && !(`${r.loc} ${r.status}`.toLowerCase().includes(search.toLowerCase()))) continue;
    const key = r.loc || "(blank)";
    if (!map.has(key)) map.set(key, { loc: key, yes: 0, no: 0, total: 0 });
    const row = map.get(key);
    const s = (r.status || "").toLowerCase();
    if (s === "yes") row.yes++;
    else if (s === "no") row.no++;
    row.total++;
  }
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

function aggregateMonthly(rowData, monthFilter, tlFilter, locFilter, search) {
  const map = new Map();
  for (const r of rowData) {
    if (tlFilter && r.tl !== tlFilter) continue;
    if (locFilter && r.loc !== locFilter) continue;
    if (search && !(`${r.tl} ${r.loc} ${r.bn || ""}`.toLowerCase().includes(search.toLowerCase()))) continue;
    const m = monthFromDate(r.date);
    if (!m) continue;
    if (monthFilter && m !== monthFilter) continue;
    if (!map.has(r.tl)) {
      const row = { tl: r.tl, total: 0 };
      MONTHS.forEach(mo => row[mo] = 0);
      map.set(r.tl, row);
    }
    const row = map.get(r.tl);
    row[m]++;
    row.total++;
  }
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

function aggregateSentBack(rowData, monthFilter, tlFilter, locFilter, search, sboFilter) {
  const map = new Map();
  for (const r of rowData) {
    if (tlFilter && r.tl !== tlFilter) continue;
    if (locFilter && r.loc !== locFilter) continue;
    if (search && !(`${r.tl} ${r.loc} ${r.bn || ""}`.toLowerCase().includes(search.toLowerCase()))) continue;
    const m = monthFromDate(r.date);
    if (monthFilter && m !== monthFilter) continue;
    if (!r.sbo) continue;
    if (sboFilter && sboFilter.length && !sboFilter.includes(r.sbo)) continue;
    if (!map.has(r.tl)) {
      const row = { tl: r.tl, total: 0 };
      SBO_KEYS.forEach(k => row[k] = 0);
      map.set(r.tl, row);
    }
    const row = map.get(r.tl);
    if (row[r.sbo] != null) { row[r.sbo]++; row.total++; }
  }
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

// Builds Sent Back data grouped Month-wise (used for the month-wise Excel download only).
// Reads the Delivery Date on each row, converts it to a Month via monthFromDate,
// and returns only months that actually have matching data, in calendar order.
function aggregateSentBackByMonth(rowData, monthFilter, tlFilter, locFilter, search, sboFilter) {
  const monthMap = new Map(); // month label -> Map(tl -> row)
  for (const r of rowData) {
    if (tlFilter && r.tl !== tlFilter) continue;
    if (locFilter && r.loc !== locFilter) continue;
    if (search && !(`${r.tl} ${r.loc} ${r.bn || ""}`.toLowerCase().includes(search.toLowerCase()))) continue;
    const m = monthFromDate(r.date);
    if (!m) continue;
    if (monthFilter && m !== monthFilter) continue;
    if (!r.sbo) continue;
    if (sboFilter && sboFilter.length && !sboFilter.includes(r.sbo)) continue;
    if (!monthMap.has(m)) monthMap.set(m, new Map());
    const tlMap = monthMap.get(m);
    if (!tlMap.has(r.tl)) {
      const row = { tl: r.tl, total: 0 };
      SBO_KEYS.forEach(k => row[k] = 0);
      tlMap.set(r.tl, row);
    }
    const row = tlMap.get(r.tl);
    if (row[r.sbo] != null) { row[r.sbo]++; row.total++; }
  }
  const groups = [];
  MONTHS.forEach(m => {
    if (!monthMap.has(m)) return;
    const rows = Array.from(monthMap.get(m).values()).sort((a, b) => b.total - a.total);
    const grandTotal = rows.reduce((acc, r) => {
      SBO_KEYS.forEach(k => { acc[k] = (acc[k] || 0) + (r[k] || 0); });
      acc.total += r.total;
      return acc;
    }, { total: 0 });
    groups.push({ month: m, rows, grandTotal });
  });
  return groups;
}

function esc(s) {

function derive() {
  const mappingDict = buildMappingDict(state.mappingRows);
  const tlSet = new Set(state.mappingRows.map(m => m.tl));
  state.rowData.forEach(r => tlSet.add(r.tl));
  state.paymentRows.forEach(r => tlSet.add(r.tl));
  const tlList = Array.from(tlSet).filter(Boolean).sort();
  const effectiveRowData = state.filters.dedupeMode === "unique" ? dedupeByBookingId(state.rowData) : state.rowData;
  const monthSet = new Set(effectiveRowData.map(r => monthFromDate(r.date)).filter(Boolean));
  const availableMonths = MONTHS.filter(m => monthSet.has(m));
  const mappedTLs = Array.from(new Set(state.mappingRows.map(m => m.tl))).filter(Boolean);

  const locSet = new Set(state.mappingRows.map(m => m.location));
  const locationList = Array.from(locSet).filter(Boolean).sort();

  const f = state.filters;
  const paymentReport = aggregatePayment(state.paymentRows, f.tl, f.location, f.status, f.search, mappedTLs);
  const unknownLocationReport = aggregateUnknownLocations(state.paymentRows, f.tl, f.location, f.status, f.search);
  const paymentGrandTotal = paymentReport.reduce((acc, r) => { acc.yes += r.yes; acc.no += r.no; acc.total += r.total; return acc; }, { yes: 0, no: 0, total: 0 });
  const monthlyReport = aggregateMonthly(effectiveRowData, f.month, f.tl, f.location, f.search);
  const sentBackReport = aggregateSentBack(effectiveRowData, f.month, f.tl, f.location, f.search, f.sbo);
  const sentBackGrandTotal = sentBackReport.reduce((acc, r) => {
    SBO_KEYS.forEach(k => { acc[k] = (acc[k] || 0) + (r[k] || 0); });
    acc.total += r.total;
    return acc;
  }, { total: 0 });

  let totalOrders = 0, payYes = 0, payNo = 0, breach = 0, pending = 0, noBreach = 0, sentBack = 0;
  const activeTLs = new Set(), activeLocs = new Set();
  monthlyReport.forEach(r => { totalOrders += r.total; activeTLs.add(r.tl); });
  sentBackReport.forEach(r => { breach += r.Breach || 0; pending += r.Pending || 0; noBreach += r["No Breach"] || 0; sentBack += r["Sent Back"] || 0; });
  paymentReport.forEach(r => { payYes += r.yes; payNo += r.no; });
  effectiveRowData.forEach(r => { if (r.loc) activeLocs.add(r.loc); });
  const kpis = { "Total orders": totalOrders, "Payment yes": payYes, "Payment no": payNo, "Breach": breach, "Pending": pending, "No breach": noBreach, "Sent back": sentBack, "Total TL": activeTLs.size || tlList.length, "Total locations": activeLocs.size || locationList.length };

  const filteredExplorer = effectiveRowData.filter(r => {
    if (f.tl && r.tl !== f.tl) return false;
    if (f.location && r.loc !== f.location) return false;
    if (f.month && monthFromDate(r.date) !== f.month) return false;
    if (f.search && !(`${r.tl} ${r.loc} ${r.bn || ""} ${r.sbo || ""}`.toLowerCase().includes(f.search.toLowerCase()))) return false;
    return true;
  }).map(r => ({ ...r, month: monthFromDate(r.date) || "-" }));

  return { mappingDict, tlList, locationList, availableMonths, paymentReport, unknownLocationReport, paymentGrandTotal, monthlyReport, sentBackReport, sentBackGrandTotal, kpis, filteredExplorer, effectiveRowData };
}

function sortRows(rows, key, dir) {
  const copy = [...rows];
  copy.sort((a, b) => {
    const av = a[key], bv = b[key];
    if (typeof av === "number" && typeof bv === "number") return dir === "asc" ? av - bv : bv - av;
    const as = String(av ?? ""), bs = String(bv ?? "");
    return dir === "asc" ? as.localeCompare(bs) : bs.localeCompare(as);
  });
  return copy;
}

function exportCSV(filename, columns, rows) {
  const header = columns.map(c => c.label).join(",");
  const lines = rows.map(r => columns.map(c => {
    const v = r[c.key];
    const s = v == null ? "" : String(v);
    return s.includes(",") ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(","));
  const csv = [header, ...lines].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Styled Excel export (SpreadsheetML) ----
// The bundled SheetJS community build cannot write cell styles, so professional
// formatting (bold headers, borders, auto-fit columns, highlighted grand totals)
// is produced with the Excel-native SpreadsheetML XML format instead, which
// Excel opens directly with full styling support.
function xmlEscape(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function excelXmlCell(value, styleId) {
  const isNum = typeof value === "number";
  const v = isNum ? value : xmlEscape(value == null ? "" : String(value));
  if (value == null || value === "") return `<Cell${styleId ? ` ss:StyleID="${styleId}"` : ""}/>`;
  return `<Cell${styleId ? ` ss:StyleID="${styleId}"` : ""}><Data ss:Type="${isNum ? "Number" : "String"}">${v}</Data></Cell>`;
}
function excelXmlRow(cells) {
  return `<Row>${cells.map(c => excelXmlCell(c.v, c.style)).join("")}</Row>`;
}
function excelXmlColWidths(columns, rows) {
  return columns.map(c => {
    const maxLen = Math.max(String(c.label).length, ...rows.map(r => String(r[c.key] ?? "").length), 4);
    return Math.min(Math.max(maxLen * 7 + 16, 60), 260);
  });
}
function buildExcelXmlSheetFromRows(name, rows, colWidths) {
  let xml = `<Worksheet ss:Name="${xmlEscape(name).slice(0, 31)}"><Table>`;
  (colWidths || []).forEach(w => { xml += `<Column ss:Width="${w}"/>`; });
  rows.forEach(r => { xml += excelXmlRow(r); });
  xml += `</Table></Worksheet>`;
  return xml;
}
function buildExcelXmlSheet(name, columns, rows, grandTotalRow) {
  const colWidths = excelXmlColWidths(columns, grandTotalRow ? [...rows, grandTotalRow] : rows);
  const xmlRows = [];
  xmlRows.push(columns.map(c => ({ v: c.label, style: "sHeader" })));
  rows.forEach(r => xmlRows.push(columns.map(c => ({ v: r[c.key] ?? (c.key === "tl" || c.key === "loc" ? "" : 0), style: "sCell" }))));
  if (grandTotalRow) xmlRows.push(columns.map(c => ({ v: grandTotalRow[c.key], style: "sTotal" })));
  return buildExcelXmlSheetFromRows(name, xmlRows, colWidths);
}
function writeExcelXml(filename, sheetsXml) {
  const styles = `
  <Style ss:ID="sHeader"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#2F5496" ss:Pattern="Solid"/>
    <Borders><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders>
    <Alignment ss:Horizontal="Center"/></Style>
  <Style ss:ID="sCell"><Borders><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
  <Style ss:ID="sTotal"><Font ss:Bold="1"/><Interior ss:Color="#FFE699" ss:Pattern="Solid"/>
    <Borders><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
  <Style ss:ID="sSection"><Font ss:Bold="1" ss:Size="12"/></Style>`;
  const xml = `<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n<Styles>${styles}</Styles>\n${sheetsXml}\n</Workbook>`;
  const blob = new Blob([xml], { type: "application/vnd.ms-excel" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportXLSX(filename, columns, rows, grandTotal, extraSheet, sheetName) {

// Writes the Sent Back Report Excel grouped Month-wise: one block per month with
// its own header row and Grand Total row, followed by an Overall Grand Total
// summarizing all months combined. Only months with data are included, in
// calendar order (January -> December).
// Uses the same styled Excel-native SpreadsheetML output as the other exports
// (bold headers, borders on every cell, highlighted Grand Total rows, auto-fit
// column widths) so formatting is consistent across every download in the app.
function exportSentBackMonthWise(filename, columns, monthGroups) {
  const valueCols = columns.filter(c => c.key !== "tl" && c.key !== "total");
  const overallTotal = { total: 0 };
  valueCols.forEach(c => { overallTotal[c.key] = 0; });

  const xmlRows = [];
  const widthSampleRows = []; // plain row objects, used only to compute auto-fit widths
  monthGroups.forEach(g => {
    xmlRows.push([{ v: `Month: ${g.month}`, style: "sSection" }]);
    xmlRows.push(columns.map(c => ({ v: c.label, style: "sHeader" })));
    g.rows.forEach(r => {
      xmlRows.push(columns.map(c => ({ v: r[c.key] ?? (c.key === "tl" ? "" : 0), style: "sCell" })));
      widthSampleRows.push(r);
    });
    const totalRow = {};
    columns.forEach(c => { totalRow[c.key] = c.key === "tl" ? "Grand Total" : (g.grandTotal[c.key] ?? 0); });
    xmlRows.push(columns.map(c => ({ v: totalRow[c.key], style: "sTotal" })));
    widthSampleRows.push(totalRow);
    xmlRows.push([]);
    valueCols.forEach(c => { overallTotal[c.key] += (g.grandTotal[c.key] || 0); });
    overallTotal.total += g.grandTotal.total;
  });

  const overallRow = {};
  columns.forEach(c => { overallRow[c.key] = c.key === "tl" ? "Overall Grand Total" : (overallTotal[c.key] ?? 0); });
  xmlRows.push([{ v: "Overall Grand Total", style: "sSection" }]);
  xmlRows.push(columns.map(c => ({ v: overallRow[c.key], style: "sTotal" })));
  widthSampleRows.push(overallRow);

  const colWidths = excelXmlColWidths(columns, widthSampleRows);
  const sheetXml = buildExcelXmlSheetFromRows("Sent Back Report", xmlRows.length ? xmlRows : [[{ v: "No data", style: "sCell" }]], colWidths);
  writeExcelXml(filename.replace(/\.xlsx$/i, ".xls"), sheetXml);
}

function paymentStatusMode() {
  return state.filters.status === "Yes" ? "yes" : state.filters.status === "No" ? "no" : "all";
}
function paymentColumns(mode) {
  if (mode === "yes") return [{ key: "tl", label: "TL Name" }, { key: "yes", label: "Yes" }, { key: "total", label: "Total" }];
  if (mode === "no") return [{ key: "tl", label: "TL Name" }, { key: "no", label: "No" }, { key: "total", label: "Total" }];
  return [{ key: "tl", label: "TL Name" }, { key: "yes", label: "Yes" }, { key: "no", label: "No" }, { key: "total", label: "Total" }];
}
function unknownLocationColumns(mode) {
  if (mode === "yes") return [{ key: "loc", label: "Location" }, { key: "yes", label: "Yes" }, { key: "total", label: "Total" }];
  if (mode === "no") return [{ key: "loc", label: "Location" }, { key: "no", label: "No" }, { key: "total", label: "Total" }];
  return [{ key: "loc", label: "Location" }, { key: "yes", label: "Yes" }, { key: "no", label: "No" }, { key: "total", label: "Total" }];
}

function renderMonthly(d) {

function sentBackLabel(k) { return k === "No Breach" ? "No breach" : (k === "Sent Back" ? "Sent back" : k); }
function sentBackColumns(sboFilter) {
  const selected = (sboFilter && sboFilter.length) ? sboFilter : SBO_KEYS;
  const cols = [{ key: "tl", label: "TL name" }];
  SBO_KEYS.forEach(k => { if (selected.includes(k)) cols.push({ key: k, label: sentBackLabel(k) }); });

  return cols;

function sentBackFileName(sboFilter) {
  const selected = (sboFilter && sboFilter.length) ? sboFilter : [];
  if (!selected.length || selected.length === SBO_KEYS.length) return "Sent_Back_All.xlsx";
  return "Sent_Back_" + selected.map(s => s.replace(/\s+/g, "")).join("_") + ".xlsx";
}

function renderPCFileStatus() {

  <div style="font-size:11px; margin-bottom:12px;" class="mut2">Uses the TL Assigned File already uploaded on the Dashboard tab for automatic TL assignment (matched by Location). Old Data and Current Data are saved automatically and remain available after a refresh — use Replace or Remove on each card to change them.</div>
  ${tableHtml}`;
}

function buildMiniTable(title, rows, columns) {

      <tbody>${rows.slice(0, 10).map(r => `<tr>${columns.map(c => `<td style="padding:6px 8px; text-align:${c === "tl" ? "left" : "right"}; border-bottom:1px solid var(--border);" class="muted">${r[c] ?? "-"}</td>`).join("")}</tr>`).join("")}</tbody>

}

function render() {
  document.getElementById("app").setAttribute("data-theme", state.mode);
  document.getElementById("themeBtn").innerHTML = state.mode === "light" ? "&#9790; Theme" : "&#9788; Theme";

  const printBtnEl = document.getElementById("printBtn");
  printBtnEl.disabled = !state.reportGenerated;
  printBtnEl.style.opacity = state.reportGenerated ? "1" : ".45";
  printBtnEl.style.cursor = state.reportGenerated ? "pointer" : "not-allowed";

  document.getElementById("tabsRow").innerHTML = TABS.map(tb => `
    <button class="tabbtn ${state.activeTab === tb.id ? "active" : ""}" data-tab="${tb.id}">${tb.icon} ${esc(tb.label)}</button>
  `).join("");

  const d = derive();
  let body = "";
  if (state.activeTab !== "history" && state.activeTab !== "pcfilestatus") body += buildFilterBar(d);
  if (state.activeTab === "dashboard") body += renderDashboard(d);
  else if (state.activeTab === "payment") body += renderPayment(d);
  else if (state.activeTab === "monthly") body += renderMonthly(d);
  else if (state.activeTab === "sentback") body += renderSentBack(d);
  else if (state.activeTab === "explorer") body += renderExplorer(d);
  else if (state.activeTab === "pcfilestatus") body += renderPCFileStatus();
  else if (state.activeTab === "history") body += renderHistory();

  document.getElementById("content").innerHTML = body;
  attachContentListeners();
}
function attachContentListeners() {
  document.querySelectorAll("[data-filter]").forEach(el => {
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", (e) => {
      const key = el.getAttribute("data-filter");
      state.filters[key] = e.target.value;
      state.page = 1;
      if (state.activeTab === "payment" && key !== "month") state.paymentGenerated = false;
      render();
    });
  });
  const clearBtn = document.getElementById("clearFiltersBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => {
    state.filters = { month: "", tl: "", location: "", status: "", search: "", sbo: [...SBO_KEYS] };
    state.page = 1;
    if (state.activeTab === "payment") state.paymentGenerated = false;
    render();
  });

  document.querySelectorAll("[data-sbo-filter]").forEach(el => {
    el.addEventListener("change", () => {
      const val = el.getAttribute("data-sbo-filter");
      if (val === "__all__") {
        state.filters.sbo = el.checked ? [...SBO_KEYS] : [];
      } else {
        const cur = new Set(state.filters.sbo || []);
        if (el.checked) cur.add(val); else cur.delete(val);
        state.filters.sbo = SBO_KEYS.filter(k => cur.has(k));
      }
      state.page = 1;
      render();
    });
  });
  const generateBtn = document.getElementById("generateReportBtn");
  if (generateBtn) generateBtn.addEventListener("click", () => {
    if (state.staged.mapping) { state.mappingRows = state.staged.mapping.data; state.staged.mapping = null; }
    if (state.staged.payment) { state.paymentRows = state.staged.payment.data; state.staged.payment = null; }
    if (state.staged.rowdata) { state.rowData = state.staged.rowdata.data; state.staged.rowdata = null; }
    state.paymentGenerated = true;
    state.reportGenerated = true;
    state.page = 1;
    render();
  });

  document.querySelectorAll("[data-sort-key]").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.getAttribute("data-sort-key");
      state.sort = state.sort.key === key ? { key, dir: state.sort.dir === "asc" ? "desc" : "asc" } : { key, dir: "desc" };
      render();
    });
  });

  document.querySelectorAll("[data-page]").forEach(el => {
    el.addEventListener("click", () => {
      if (el.hasAttribute("disabled")) return;
      state.page += el.getAttribute("data-page") === "next" ? 1 : -1;
      render();
    });
  });

  document.querySelectorAll("[data-export-btn]").forEach(el => {
    el.addEventListener("click", () => {
      if (el.hasAttribute("disabled")) return;
      const containerId = el.getAttribute("data-export-btn");
      const container = document.getElementById(containerId);
      const exportName = container.getAttribute("data-export");
      const d = derive();
      if (containerId === "paymentTable") {
        const mode = paymentStatusMode();
        exportXLSX(
          exportName,
          paymentColumns(mode),
          sortRows(d.paymentReport, state.sort.key, state.sort.dir),
          d.paymentGrandTotal,
          { columns: unknownLocationColumns(mode), rows: d.unknownLocationReport }
        );
        return;
      }
      if (containerId === "sentbackTable") {
        const cols = sentBackColumns(state.filters.sbo);
        const f2 = state.filters;
        const exportRowData = f2.dedupeMode === "unique" ? dedupeByBookingId(state.rowData) : state.rowData;
        const monthGroups = aggregateSentBackByMonth(exportRowData, f2.month, f2.tl, f2.location, f2.search, f2.sbo);
        exportSentBackMonthWise(exportName, cols, monthGroups);
        return;
      }
      if (containerId === "pcfilestatusTable") {
        const pc = computePCFileStatus();
        const pcCols = [{ key: "tl", label: "TL Name" }, { key: "newFile", label: "New File" }, { key: "oldFile", label: "Old File" }, { key: "total", label: "Total" }];
        exportXLSX(exportName, pcCols, sortRows(pc.report, state.sort.key, state.sort.dir), pc.grandTotal, null, "PC File Status");
        return;
      }
      let rows, columns;
      if (containerId === "monthlyTable") { rows = d.monthlyReport; columns = [{ key: "tl", label: "TL Name" }, ...d.availableMonths.map(m => ({ key: m, label: m })), { key: "total", label: "Total" }]; }
      else { rows = d.filteredExplorer; columns = [{ key: "tl", label: "TL Name" }, { key: "loc", label: "Location" }, { key: "bn", label: "Booking No" }, { key: "date", label: "Delivery Date" }, { key: "month", label: "Month" }, { key: "sbo", label: "Sent Back" }, { key: "status", label: "Deal Status" }]; }
      exportCSV(exportName, columns, sortRows(rows, state.sort.key, state.sort.dir));
    });
  });

  ["mapping", "payment", "rowdata", "olddata", "currentdata"].forEach(kind => {
    const drop = document.querySelector(`[data-drop="${kind}"]`);
    const input = document.querySelector(`[data-file-input="${kind}"]`);
    if (drop) {
      drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("drag"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
      drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("drag"); if (e.dataTransfer.files[0]) handleUpload(kind, e.dataTransfer.files[0]); });
    }
    if (input) input.addEventListener("change", e => { if (e.target.files[0]) handleUpload(kind, e.target.files[0]); });
  });

  document.querySelectorAll("[data-remove]").forEach(el => {
    el.addEventListener("click", async () => {
      const kind = el.getAttribute("data-remove");
      const label = kind === "olddata" ? "Old Data" : "Current Data";
      const ok = window.confirm(`Remove ${label}? This clears it from PC File Status and cannot be undone. The TL Mapping and rest of the dashboard are not affected.`);
      if (!ok) return;
      const blankMeta = { filename: null, date: null, warnings: [], error: null, count: 0 };
      if (kind === "olddata") { state.oldData = []; state.oldDataMeta = blankMeta; }
      else { state.currentData = []; state.currentDataMeta = blankMeta; }
      try { await window.storage.delete(`${kind}-latest`, false); } catch (e) {}
      render();
    });
  });

  const saveBtn = document.getElementById("saveHistoryBtn");
  if (saveBtn) saveBtn.addEventListener("click", saveToHistory);

  document.querySelectorAll("[data-history-item]").forEach(el => {
    el.addEventListener("click", () => loadHistoryDetail(el.getAttribute("data-history-item")));
  });
  document.querySelectorAll("[data-history-delete]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); deleteHistoryEntry(el.getAttribute("data-history-delete")); });
  });
}

async function handleUpload(kind, file) {
  const uploadDate = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  const sig = `${file.name}|${file.size}|${file.lastModified}`;
  const priorMeta = kind === "mapping" ? state.mappingMeta : kind === "payment" ? state.paymentMeta : kind === "rowdata" ? state.rowDataMeta : kind === "olddata" ? state.oldDataMeta : state.currentDataMeta;
  if (priorMeta && priorMeta.signature === sig) {
    const proceed = window.confirm("This file appears to have already been processed. Do you want to continue?");
    if (!proceed) return;
  }
  try {
    const { rows } = await readWorkbook(file);
    const mappingDict = buildMappingDict(state.mappingRows);
    let res;
    if (kind === "mapping") res = processMappingRows(rows);
    else if (kind === "payment") res = processPaymentRows(rows, mappingDict);
    else if (kind === "rowdata") res = processRowDataRows(rows, mappingDict);
    else res = processBookingRows(rows); // olddata / currentdata

    const meta = { filename: file.name, date: uploadDate, warnings: res.warnings || [], error: res.error || null, count: res.data.length, signature: sig };
    if (kind === "mapping") state.mappingMeta = meta;
    else if (kind === "payment") state.paymentMeta = meta;
    else if (kind === "rowdata") state.rowDataMeta = meta;
    else if (kind === "olddata") state.oldDataMeta = meta;
    else state.currentDataMeta = meta;

    if (res.error) {
      state.staged[kind] = null;
      render();
      return;
    }

    if (kind === "mapping") {
      // Master Mapping is saved once and reused automatically — commit immediately, no staging.
      state.mappingRows = res.data;
      try { await window.storage.set("mapping-latest", JSON.stringify({ rows: res.data, meta }), false); } catch (e) {}
    } else if (kind === "olddata" || kind === "currentdata") {
      // Old Data / Current Data (PC File Status) also commit immediately and persist across
      // refresh, just like the mapping file — cleared only via the Remove button.
      if (kind === "olddata") state.oldData = res.data; else state.currentData = res.data;
      try { await window.storage.set(`${kind}-latest`, JSON.stringify({ rows: res.data, meta }), false); } catch (e) {}
    } else {
      // Payment / Row Data drive the report — hold new data until the user
      // clicks Generate Report, so the currently visible report and downloads are unaffected until then.
      state.staged[kind] = { data: res.data, meta };
    }
  } catch (e) {
    const msg = "Couldn't read this file. Make sure it's a valid .xlsx or .xls Excel file.";
    const meta = { filename: file.name, date: uploadDate, warnings: [], error: msg, count: 0, signature: sig };
    if (kind === "mapping") state.mappingMeta = meta;
    else if (kind === "payment") state.paymentMeta = meta;
    else if (kind === "rowdata") state.rowDataMeta = meta;
    else if (kind === "olddata") state.oldDataMeta = meta;
    else state.currentDataMeta = meta;
    state.staged[kind] = null;
  }
  render();
}

async function saveToHistory() {
  state.savingHistory = true; render();
  try {
    const d = derive();
    const dateKey = new Date().toISOString().slice(0, 10);
    const label = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    const snapshot = { dateKey, label, kpis: d.kpis, paymentReport: d.paymentReport, monthlyReport: d.monthlyReport, sentBackReport: d.sentBackReport, savedAt: new Date().toISOString() };
    await window.storage.set(`history:${dateKey}`, JSON.stringify(snapshot), false);
    const newIndex = [{ dateKey, label }, ...state.history.filter(h => h.dateKey !== dateKey)].sort((a, b) => b.dateKey.localeCompare(a.dateKey));
    state.history = newIndex;
    await window.storage.set("history-index", JSON.stringify(newIndex), false);
    state.historyBanner = { type: "success", text: `Report saved for ${label}.` };
  } catch (e) {
    state.historyBanner = { type: "error", text: "Couldn't save this report. Try again." };
  }
  state.savingHistory = false;
  render();
  setTimeout(() => { state.historyBanner = null; render(); }, 4000);
}

async function loadHistoryDetail(dateKey) {
  try {
    const res = await window.storage.get(`history:${dateKey}`, false);
    if (res && res.value) state.historyDetail = JSON.parse(res.value);
  } catch (e) { state.historyDetail = null; }
  render();
}

async function deleteHistoryEntry(dateKey) {
  try {
    await window.storage.delete(`history:${dateKey}`, false);
    state.history = state.history.filter(h => h.dateKey !== dateKey);
    await window.storage.set("history-index", JSON.stringify(state.history), false);
    if (state.historyDetail && state.historyDetail.dateKey === dateKey) state.historyDetail = null;
  } catch (e) {}
  render();
}

document.getElementById("printBtn").addEventListener("click", () => { if (!state.reportGenerated) return; window.print(); });
document.getElementById("themeBtn").addEventListener("click", () => { state.mode = state.mode === "light" ? "dark" : "light"; render(); });
document.getElementById("resetBtn").addEventListener("click", resetDashboard);
document.getElementById("tabsRow").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-tab]");
  if (btn) { state.activeTab = btn.getAttribute("data-tab"); state.page = 1; render(); }
});

(async function init() {
  // The dashboard/report always starts clean on load or refresh (see getInitialReportState()) -
  // but the Master Mapping, Old Data, and Current Data are saved config, so they're restored
  // automatically here.
  try {
    const saved = await window.storage.get("mapping-latest", false);
    if (saved && saved.value) {
      const parsed = JSON.parse(saved.value);
      state.mappingRows = parsed.rows;
      state.mappingMeta = parsed.meta;
    }
  } catch (e) {}
  try {
    const savedOld = await window.storage.get("olddata-latest", false);
    if (savedOld && savedOld.value) {
      const parsed = JSON.parse(savedOld.value);
      state.oldData = parsed.rows;
      state.oldDataMeta = parsed.meta;
    }
  } catch (e) {}
  try {
    const savedCurrent = await window.storage.get("currentdata-latest", false);
    if (savedCurrent && savedCurrent.value) {
      const parsed = JSON.parse(savedCurrent.value);
      state.currentData = parsed.rows;
      state.currentDataMeta = parsed.meta;
    }
  } catch (e) {}
  try {
    const idx = await window.storage.get("history-index", false);
    if (idx && idx.value) state.history = JSON.parse(idx.value);
  } catch (e) {}
  render();
})();
</script>
